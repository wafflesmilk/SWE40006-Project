name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository 
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6.5.0
      with:
        node-version: 22
        cache: 'npm' # prevent constant redownload of dependencies to improve performance

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test --if-present

    - name: Build app
      run: npm run build 
